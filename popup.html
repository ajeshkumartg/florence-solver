<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 15px; font-family: sans-serif; }
    h3 { margin-top: 0; }
    input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; }
    #saveBtn { background-color: #2196F3; color: white; margin-bottom: 15px; }
    #solveBtn { background-color: #4CAF50; color: white; }
    button:hover { opacity: 0.9; }
    #status { margin-top: 10px; font-size: 12px; color: #555; }
    .note { font-size: 11px; color: #666; margin-bottom: 10px; }
  </style>
</head>
<body>
  <h3>AI Settings</h3>
  
  <label>Provider:</label>
  <select id="provider" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box;">
    <option value="gemini">Gemini</option>
    <option value="openai">OpenAI</option>
    <option value="groq">Groq</option>
    <option value="mistral">Mistral</option>
  </select>
  
  <label>API Key:</label>
  <input type="password" id="apiKey" placeholder="Paste key here..." />
  <div class="note">Get keys from respective provider consoles.</div>
  
  <button id="saveBtn">Save Key</button>
  
  <hr style="border: 0; border-top: 1px solid #ccc; margin-bottom: 15px;">
  
  <button id="solveBtn">🪄 Solve Page</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
